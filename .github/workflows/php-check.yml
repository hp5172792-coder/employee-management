name: PHP Syntax Check

on:
  push:
    branches:
      - ci/php-check
  pull_request:
    branches:
      - main

jobs:
  php-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Check PHP syntax
        run: php -l index.php
